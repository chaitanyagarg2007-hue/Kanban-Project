
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Kanban Board</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">WORKSPACE / PERSONAL</p>
        <h1>TaskFlow<span>.</span></h1>
        <p class="subtitle">A little progress every day adds up.</p>
      </div>
      
    <button id="theme-toggle" class="theme-toggle" type="button">
    ☾ Dark mode
    </button>

      <button id="new-task-btn" class="primary-btn" type="button">
        <span>+</span> New task
      </button>
    </header>

    <section class="board" aria-label="Kanban board">

      <section class="column" data-status="todo">
        <header class="column-header">
          <div class="column-title">
            <span class="status-dot todo-dot"></span>
            <h2>To do</h2>
          </div>
          <span class="task-count" id="todo-count">0</span>
        </header>
        <div class="task-list" id="todo-list"></div>
        <button class="add-task-inline" data-add-status="todo" type="button">
          + Add a task
        </button>
      </section>

      <section class="column" data-status="inProgress">
        <header class="column-header">
          <div class="column-title">
            <span class="status-dot progress-dot"></span>
            <h2>In progress</h2>
          </div>
          <span class="task-count" id="inProgress-count">0</span>
        </header>
        <div class="task-list" id="inProgress-list"></div>
        <button class="add-task-inline" data-add-status="inProgress" type="button">
          + Add a task
        </button>
      </section>

      <section class="column" data-status="completed">
        <header class="column-header">
          <div class="column-title">
            <span class="status-dot completed-dot"></span>
            <h2>Completed</h2>
          </div>
          <span class="task-count" id="completed-count">0</span>
        </header>
        <div class="task-list" id="completed-list"></div>
        <button class="add-task-inline" data-add-status="completed" type="button">
          + Add a task
        </button>
      </section>

    </section>

    <p class="footer-note">
      Your tasks are saved in this browser automatically.
    </p>
  </main>

  <dialog id="task-dialog" class="task-dialog">
    <form id="task-form">
      <div class="dialog-heading">
        <div>
          <p class="eyebrow">MAKE IT HAPPEN</p>
          <h2>Create a task</h2>
        </div>
        <button id="close-dialog-btn" class="icon-btn" type="button"
          aria-label="Close dialog">×</button>
      </div>

      <label for="task-title">Task title</label>
      <input id="task-title" name="title" type="text"
        maxlength="90" placeholder="e.g. Finish JavaScript project" required>

      <label for="task-description">
        Description <span>(optional)</span>
      </label>
      <textarea id="task-description" name="description" rows="4"
        maxlength="500" placeholder="What needs to get done?"></textarea>

      <label for="task-status">Column</label>
      <select id="task-status" name="status">
        <option value="todo">To do</option>
        <option value="inProgress">In progress</option>
        <option value="completed">Completed</option>
      </select>

      <p id="form-error" class="form-error" role="alert"></p>

      <div class="dialog-actions">
        <button id="cancel-btn" class="secondary-btn" type="button">
          Cancel
        </button>
        <button class="primary-btn" type="submit">Save task</button>
      </div>
    </form>
  </dialog>
</body>
</html>
